packages:
  - apps/*
  - packages/*
overrides:
  'markdownlint-cli2>smol-toml': 1.7.1
  react-native-reanimated: 4.5.1
  react-native-worklets: 0.10.1
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  'xcode>uuid': 11.1.1
  'query-string>decode-uri-component': 0.5.0
allowBuilds:
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/linux-x64': true
  esbuild: true
minimumReleaseAgeExclude:
