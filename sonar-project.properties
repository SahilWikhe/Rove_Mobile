sonar.projectName=Rove Mobile
sonar.sourceEncoding=UTF-8
# Scan authored app/backend/tooling code, including versioned SQL migrations.
sonar.sources=apps,packages,scripts,.github
sonar.tests=apps,packages,scripts,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs,e2e/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.expo/**,**/ios/Pods/**,**/android/.gradle/**,packages/database/migrations/meta/**,**/*.test.ts,**/*.test.tsx,**/*.test.mjs
# Coverage is not fabricated: the existing CI tests currently do not produce LCOV reports.

sonar.javascript.lcov.reportPaths=coverage/tooling.lcov,packages/contracts/coverage/lcov.info,packages/database/coverage/lcov.info,packages/server/coverage/lcov.info,packages/mobile-core/coverage/lcov.info,apps/api/coverage/lcov.info,apps/driver/coverage/lcov.info
