name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  DO_NOT_TRACK: '1'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm boundaries:check
      - run: pnpm tooling:test
      - run: pnpm typecheck
      - run: pnpm docs:check
      - run: pnpm --filter @rove/api build
      - run: pnpm --filter @rove/api verify:build
      - name: Check migration snapshot matches the schema
        run: |
          pnpm --filter @rove/database exec drizzle-kit generate
          test -z "$(git status --porcelain -- packages/database/migrations)"

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      # Real disposable PostgreSQL instances. No DATABASE_URL or cloud secrets.
      - run: pnpm test

  browser:
    name: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      # Isolated synthetic API + both Expo web apps; no cloud credentials.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Synthetic-only screenshots/traces make browser failures diagnosable.
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  mobile:
    name: mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rove/rider exec expo install --check
      - run: pnpm --filter @rove/driver exec expo install --check
      - run: pnpm build:mobile
      # Exports compile JS/Hermes assets; they are not signed native binary/device tests.

  native-android:
    name: native-android (${{ matrix.role }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        role: [rider, driver]
    env:
      EXPO_PUBLIC_SYNTHETIC: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Select Java 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Generate Android project
        run: pnpm --filter @rove/${{ matrix.role }} exec expo prebuild --platform android --no-install
      - name: Compile Android debug binary
        working-directory: apps/${{ matrix.role }}/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --console=plain
      - name: Compile standalone Android release binary
        working-directory: apps/${{ matrix.role }}/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --console=plain
      - name: Verify Android release includes JavaScript
        working-directory: apps/${{ matrix.role }}/android
        run: |
          unzip -p app/build/outputs/apk/release/app-release.apk assets/index.android.bundle > "$RUNNER_TEMP/android-release.bundle"
          test -s "$RUNNER_TEMP/android-release.bundle"

  native-ios:
    name: native-ios (${{ matrix.role }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        role: [rider, driver]
        include:
          - role: rider
            scheme: Rove
          - role: driver
            scheme: RoveDriver
    env:
      EXPO_PUBLIC_SYNTHETIC: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Generate iOS project
        run: pnpm --filter @rove/${{ matrix.role }} exec expo prebuild --platform ios --no-install
      - name: Install native dependencies
        working-directory: apps/${{ matrix.role }}/ios
        run: pod install --repo-update
      - name: Compile iOS simulator binary
        working-directory: apps/${{ matrix.role }}/ios
        run: >-
          xcodebuild -workspace ${{ matrix.scheme }}.xcworkspace
          -scheme ${{ matrix.scheme }} -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/rove-native-build" CODE_SIGNING_ALLOWED=NO build
      - name: Compile standalone iOS release simulator binary
        working-directory: apps/${{ matrix.role }}/ios
        run: >-
          xcodebuild -workspace ${{ matrix.scheme }}.xcworkspace
          -scheme ${{ matrix.scheme }} -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/rove-native-build" CODE_SIGNING_ALLOWED=NO build
      - name: Verify iOS release includes JavaScript
        run: test -s "$RUNNER_TEMP/rove-native-build/Build/Products/Release-iphonesimulator/${{ matrix.scheme }}.app/main.jsbundle"

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm security:audit
      - run: node scripts/install-gitleaks.mjs
      - run: gitleaks git --redact --no-banner --log-opts="--all"

  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # CodeQL reads workflow-run metadata when preparing uploaded analysis.
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript,actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          output: reports/codeql
      - run: node scripts/codeql-gate.mjs reports/codeql

  infrastructure:
    name: infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Validate without AWS credentials or deploying resources.
      - run: python3 -m venv /tmp/rove-cfn-validation
      - run: /tmp/rove-cfn-validation/bin/pip install cfn-lint==1.46.0
      - run: /tmp/rove-cfn-validation/bin/cfn-lint infra/aws/*.template.json

  ci-gate:
    name: ci-gate
    if: always()
    needs: [quality, tests, browser, mobile, native-android, native-ios, security, codeql, infrastructure]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/ci-gate.mjs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
