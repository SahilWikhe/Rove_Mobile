name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  DO_NOT_TRACK: '1'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm boundaries:check
      - run: pnpm tooling:test
      - run: pnpm typecheck
      - run: pnpm docs:check
      - run: pnpm --filter @rove/api build
      - run: pnpm --filter @rove/api verify:build
      - name: Check migration snapshot matches the schema
        run: |
          pnpm --filter @rove/database exec drizzle-kit generate
          test -z "$(git status --porcelain -- packages/database/migrations)"

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      # Real disposable PostgreSQL instances. No DATABASE_URL or cloud secrets.
      - run: pnpm test

  browser:
    name: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      # Isolated synthetic API + both Expo web apps; no cloud credentials.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  mobile:
    name: mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rove/rider exec expo install --check
      - run: pnpm --filter @rove/driver exec expo install --check
      - run: pnpm build:mobile
      # Exports compile JS/Hermes assets; they are not signed native binary/device tests.

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm security:audit
      - run: node scripts/install-gitleaks.mjs
      - run: gitleaks git --redact --no-banner --log-opts="--all"

  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript,actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          output: reports/codeql
      - run: node scripts/codeql-gate.mjs reports/codeql

  ci-gate:
    name: ci-gate
    if: always()
    needs: [quality, tests, browser, mobile, security, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/ci-gate.mjs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
