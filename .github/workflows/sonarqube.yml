name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analysis:
    name: SonarQube analysis
    # Forks and Dependabot do not receive the scan credential. Existing CI still tests them.
    # Manual runs report missing setup explicitly; automatic runs activate when the project key is set.
    if: >-
      (vars.SONAR_PROJECT_KEY != '' || github.event_name == 'workflow_dispatch') &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check SonarQube setup
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [[ -z "$SONAR_TOKEN" || -z "$SONAR_PROJECT_KEY" || -z "$SONAR_ORGANIZATION" ]]; then
            echo '::error::Set SONAR_TOKEN in repository secrets and SONAR_PROJECT_KEY / SONAR_ORGANIZATION in repository variables. See docs/75-sonarqube.md.'
            exit 1
          fi
          if [[ ! "$SONAR_PROJECT_KEY" =~ ^[a-zA-Z0-9_.:-]+$ || ! "$SONAR_ORGANIZATION" =~ ^[a-zA-Z0-9_.:-]+$ ]]; then
            echo '::error::Use the project and organization keys from SonarQube, not their display names.'
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      # Disposable local PostgreSQL and synthetic adapters; no cloud credentials.
      - run: pnpm test:coverage
      - name: Analyze code and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
