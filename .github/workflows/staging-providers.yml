name: Staging provider checks

on:
  workflow_dispatch:
    inputs:
      allow_billable_maps:
        description: 'Run up to five Google Maps requests (usage charges may apply)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-provider-checks
  cancel-in-progress: false

jobs:
  providers:
    if: github.ref == 'refs/heads/main' && inputs.allow_billable_maps
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Verify real staging providers
        run: node --import tsx packages/server/src/staging-provider-check-cli.ts --allow-billable-requests
        env:
          ROVE_ENVIRONMENT: staging
          GOOGLE_MAPS_API_KEY: ${{ secrets.STAGING_GOOGLE_MAPS_API_KEY }}
          SERVICE_AREA_JSON: ${{ vars.STAGING_SERVICE_AREA_JSON }}
          STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STRIPE_ACCOUNT_ID: ${{ vars.STAGING_STRIPE_ACCOUNT_ID }}
          STRIPE_PAYMENT_METHOD_CONFIGURATION: ${{ vars.STAGING_STRIPE_PAYMENT_METHOD_CONFIGURATION }}
