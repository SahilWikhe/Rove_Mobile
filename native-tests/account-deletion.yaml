# Debug-only synthetic session; launch the app with a dedicated local Metro/API first.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      text: Get started
      enabled: true
    timeout: 60000
- tapOn:
    text: Get started
    enabled: true
- extendedWaitUntil:
    visible: Account
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: Account
    index: 0
    enabled: true
- extendedWaitUntil:
    visible: Edit profile
    timeout: 20000
- scrollUntilVisible:
    element:
      text: Request account deletion
    centerElement: true
    direction: DOWN
    timeout: 20000
- tapOn: Request account deletion
- scrollUntilVisible:
    element:
      text: Send deletion request
    centerElement: true
    direction: DOWN
    timeout: 20000
- tapOn: Send deletion request
- scrollUntilVisible:
    element:
      text: Deletion request received
    centerElement: true
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    element:
      text: Withdraw deletion request
    centerElement: true
    direction: DOWN
    timeout: 20000
- tapOn: Withdraw deletion request
- scrollUntilVisible:
    element:
      text: Confirm withdrawal
    centerElement: true
    direction: DOWN
    timeout: 20000
- tapOn: Confirm withdrawal
- scrollUntilVisible:
    element:
      text: Deletion request withdrawn. Your account remains active.
    centerElement: true
    direction: UP
    timeout: 20000
- assertVisible: Deletion request withdrawn. Your account remains active.
- takeScreenshot: native-account-withdrawn
