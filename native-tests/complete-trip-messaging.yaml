appId: co.roveride.driver
---
- swipe:
    start: 50%, 65%
    end: 50%, 25%
    duration: 500
- scrollUntilVisible:
    element:
      text: Message rider
    direction: DOWN
    centerElement: true
- tapOn: Message rider
- extendedWaitUntil:
    visible:
      id: message-input
    timeout: 15000
- tapOn:
    id: message-input
- inputText: Native pickup check.
- tapOn: Send message
- extendedWaitUntil:
    visible: '.*Native live reply received\..*'
    timeout: 15000
- takeScreenshot: driver-live-message
- launchApp:
    appId: co.roveride.rider
    stopApp: false
    permissions: {}
- extendedWaitUntil:
    visible: Your driver is confirmed.
    timeout: 15000
- swipe:
    start: 50%, 90%
    end: 50%, 40%
    duration: 500
- scrollUntilVisible:
    element:
      text: Message driver
    direction: DOWN
    timeout: 30000
- tapOn: Message driver
- extendedWaitUntil:
    visible: '.*Native pickup check\..*'
    timeout: 15000
- tapOn:
    id: message-input
- inputText: Native rider check.
- tapOn: Send message
- extendedWaitUntil:
    visible: '.*Native driver reply received\..*'
    timeout: 15000
- takeScreenshot: rider-live-message
- runFlow:
    when:
      true: ${ENABLE_RECONNECT === "1"}
    commands:
      - tapOn:
          id: message-input
      - inputText: Native reconnect check.
      - tapOn: Send message
      - extendedWaitUntil:
          visible: '.*Native outage reply\..*'
          timeout: 30000
      - extendedWaitUntil:
          visible: '.*Native reconnected reply\..*'
          timeout: 60000
      - takeScreenshot: rider-reconnected-message
- tapOn: View this trip
- launchApp:
    appId: co.roveride.driver
    stopApp: false
    permissions: {}
- scrollUntilVisible:
    element:
      text: '.*Native rider check\..*'
    direction: UP
    centerElement: true
    timeout: 15000
- tapOn: View this trip
