# Requires the signed-in driver on Drive against the disposable synthetic API.
# The fixture must have no allocations in January 2000. No ride/payment is submitted.
appId: co.roveride.driver
---
- scrollUntilVisible:
    element: Earnings
    direction: DOWN
- tapOn: Earnings
- assertVisible: Last 7 days
- assertVisible:
    id: daily-earnings
- tapOn: Filter recorded dates
- tapOn:
    id: earnings-from-date
- eraseText
- inputText: '2000-01-01'
- assertVisible: '2000-01-01'
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: earnings-through-date
    direction: DOWN
- tapOn:
    id: earnings-through-date
- eraseText
- inputText: '2000-01-31'
- assertVisible: '2000-01-31'
- pressKey: Enter
- scrollUntilVisible:
    element: Apply dates
    direction: DOWN
- tapOn: Apply dates
- scrollUntilVisible:
    element: 2000-01-01 – 2000-01-31 · UTC
    direction: DOWN
- assertVisible: 2000-01-01 – 2000-01-31 · UTC
- scrollUntilVisible:
    element: Daily totals · swipe to see more dates
    direction: DOWN
- assertVisible: Daily totals · swipe to see more dates
- scrollUntilVisible:
    element: No recorded earnings in this date range.
    direction: DOWN
- assertVisible: No recorded earnings in this date range.
- takeScreenshot: rove-native-earnings-filtered
- scrollUntilVisible:
    element: Filter recorded dates
    direction: UP
- tapOn: Filter recorded dates
- scrollUntilVisible:
    element: All recorded dates
    direction: DOWN
- tapOn: All recorded dates
- assertNotVisible: 2000-01-01 – 2000-01-31 · UTC
